# MonsterMazeStandalone user configuration.
# These settings belong to the player installation and are preserved by the Solo updater.
# Map definitions are bundled in maps.yml and are updated with the plugin release.

mode: Original
solo-mode: false
# Emit every completed player's run to solo-runs/ for competition submission.
record-runs: true

# Active map selected by the player/admin. Persisted across restarts.
map: eyeofender

# Optional per-map mob overrides selected by the player/admin.
# Example:
# mob-overrides:
#   siberian: creeper
