# MonsterMazeStandalone user configuration.
# These settings belong to the player installation and are preserved by the Solo updater.
# Map definitions are bundled in maps.yml and are updated with the plugin release.

mode: Original
solo-mode: false
# This dedicated branch is intended to co-host beside Mineplex Reborn; preserve its lobby and join flow.
cohosted-mode: true
# Enables test-only runtime debug commands such as /mm solomode. Production deployments disable this.
debug: false
# Emit every completed player's run to solo-runs/ for competition submission.
record-runs: true

# Active map selected by the player/admin. Persisted across restarts.
map: eyeofender

# Optional per-map mob overrides selected by the player/admin.
# Example:
# mob-overrides:
#   siberian: creeper

# Set true when this plugin shares a Mineplex Reborn server. It preserves the host's join/lobby flow.
cohosted-mode: false

# Optional behaviour ported from the Mineplex Reborn Monster Maze source.
monstermaze:
  safe-pad-enhancements:
    # Repair only the central objective beacon; do not rebuild clay/base blocks.
    enabled: false
    # Optional starting stained-clay colour (Minecraft 1.8 dye data 0-15).
    surface-colour-enabled: false
    surface-colour-data: 5
