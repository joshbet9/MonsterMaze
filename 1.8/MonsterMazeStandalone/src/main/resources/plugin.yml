name: MonsterMazeStandalone
version: 1.0.0
main: me.monstermaze.MonsterMazePlugin
author: You
description: Standalone Monster Maze for local testing (ported from Mineplex)
commands:
  mm:
    description: Monster Maze commands
    usage: /mm <start|stop|setcenter|status|kit|kits>
  perftest:
    description: Temporary Monster Maze performance isolation tools
    usage: /perftest <help|start|status|count|jvm|tasks|events|foreign|monsterlogic|kitlogic|gametasks|living|entities|projectiles|items|npcs|inventory|player|world|chunks|extraworlds|tiles|purgetiles|physics|alltasks|allplugins|nuclear>
permissions:
  monstermaze.admin:
    description: Allows control of Monster Maze
    default: op
