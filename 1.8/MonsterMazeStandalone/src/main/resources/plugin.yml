name: MonsterMazeModern
version: 1.0.0
main: me.monstermaze.MonsterMazePlugin
author: You
description: Standalone enhanced Monster Maze co-hosted beside Mineplex Reborn
commands:
  mmmodernmenu:
    aliases: [mmmodernselect]
    description: Open the Monster Maze Modern selector
    usage: /mmmodernmenu
  cosmeticproto:
    aliases: [gamecosmetic, gamecosmetics]
    description: Unlock, equip and preview minigame cosmetic prototypes
    usage: /cosmeticproto <list|status|unlock|equip|off|preview>
  arcadetest:
    aliases: [arcadegame, arcadegames]
    description: Join and start playable 1.8.8 arcade cosmetic test rounds
    usage: /arcadetest <join|start|stop|unlock|leave|list|status>
  mmmodern:
    aliases: [monstermazemodern]
    description: Monster Maze Modern commands
    usage: /mmmodern <start|stop|setcenter|status|kit|kits|pb|lb|challenge>
  mmmoderndebug:
    description: Monster Maze Modern diagnostics
    usage: /mmmoderndebug [mobs]
    permission: monstermaze.admin
  mmmpause:
    description: Pause or resume Monster Maze Modern
    usage: /mmmpause
permissions:
  minigamecosmetics.admin:
    description: Allows prototype cosmetic unlocks and testing
    default: op
  monstermaze.admin:
    description: Allows control of Monster Maze
    default: op
