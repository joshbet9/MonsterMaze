# MonsterMazeStandalone user configuration.
# Map definitions are bundled in maps.yml and are updated with the plugin release.

mode: Original
solo-mode: false
# Enables test-only runtime debug commands such as /mm solomode. Production deployments disable this.
debug: false
# Emit every completed player's run to solo-runs/ for competition submission.
record-runs: true
map: eyeofender
forced-pattern: -1
mob-overrides:
  volcano: witch
  siberian: creeper

# Set true when this plugin shares a server with Mineplex Reborn.
cohosted-mode: false

# Optional behaviour ported from the Mineplex Reborn Monster Maze source.
monstermaze:
  safe-pad-enhancements:
    enabled: false
    surface-colour-enabled: false
    # Legacy Minecraft dye index 0-15; mapped to the equivalent terracotta in 1.21.
    surface-colour-data: 5
