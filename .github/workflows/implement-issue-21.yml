name: Implement issue 21
on:
  push:
    branches: [automation/issue-fixes-5-7-18-20-21]
permissions:
  contents: write
jobs:
  fix:
    if: "${{ github.event.head_commit.message == 'chore: implement issue 21' }}"
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - name: Implement Discord identity commands
        shell: python
        run: |
          from pathlib import Path
          p=Path('solo/bot/tournament_bot.py'); s=p.read_text()
          s=s.replace('import time\n', 'import time\nimport re\n', 1) if 'import re\n' not in s else s
          old='''        if sub in ("help", "?"):\n            await message.channel.send("`!tournament` • `create <name> <registration-minutes> <start-minutes>` (staff) • `register <uuid> [name]` • `bracket` • `status [uuid]` • `results`"); return'''
          new='''        if sub in ("help", "?"):\n            await message.channel.send("`!tournament` • `create <name> <registration-minutes> <start-minutes>` (staff) • `link <uuid> [minecraft-name]` • `unlink` • `register [uuid] [name]` • `bracket` • `status [uuid]` • `results`"); return'''
          if old not in s: raise SystemExit('help block missing')
          s=s.replace(old,new,1)
          old='''        if sub == "register":\n            if len(args) < 2: await message.channel.send("Usage: `!tournament register <uuid> [minecraft-name]`"); return\n            uuid, name = args[1].lower().strip(), (" ".join(args[2:]).strip() or message.author.display_name); c = db()'''
          new='''        if sub == "link":\n            if len(args) < 2: await message.channel.send("Usage: `!tournament link <uuid> [minecraft-name]`"); return\n            uuid=args[1].lower().strip(); name=" ".join(args[2:]).strip() or message.author.display_name\n            if not re.fullmatch(r"[0-9a-f]{8}-[0-9a-f]{4}-[1-5][0-9a-f]{3}-[89ab][0-9a-f]{3}-[0-9a-f]{12}", uuid): await message.channel.send("❌ Please provide a valid Minecraft UUID."); return\n            c=db()\n            try:\n                schema(c); existing=c.execute("SELECT discord_user_id FROM discord_minecraft_identity WHERE uuid=?",(uuid,)).fetchone()\n                if existing and str(existing[0]) != str(message.author.id): await message.channel.send("❌ That Minecraft UUID is already linked to another Discord user."); return\n                c.execute("INSERT INTO discord_minecraft_identity(discord_user_id,uuid,name,linked_at) VALUES(?,?,?,?) ON CONFLICT(discord_user_id) DO UPDATE SET uuid=excluded.uuid,name=excluded.name,linked_at=excluded.linked_at",(str(message.author.id),uuid,name,int(time.time()*1000))); c.commit()\n            finally: c.close()\n            await message.channel.send(f"✅ Linked your Discord account to **{name}** (`{uuid}`)."); return\n        if sub == "unlink":\n            c=db()\n            try: schema(c); c.execute("DELETE FROM discord_minecraft_identity WHERE discord_user_id=?",(str(message.author.id),)); c.commit()\n            finally: c.close()\n            await message.channel.send("✅ Minecraft identity unlinked."); return\n        if sub == "register":\n            c=db()\n            try:\n                schema(c)\n                if len(args)>=2:\n                    uuid=args[1].lower().strip(); name=" ".join(args[2:]).strip() or message.author.display_name\n                else:\n                    linked=c.execute("SELECT uuid,name FROM discord_minecraft_identity WHERE discord_user_id=?",(str(message.author.id),)).fetchone()\n                    if not linked: await message.channel.send("❌ No Minecraft identity is linked. Use `!tournament link <uuid> [minecraft-name]` or provide a UUID."); return\n                    uuid,name=str(linked[0]).lower(),(linked[1] or message.author.display_name)\n            finally: c.close()\n            c=db()'''
          if old not in s: raise SystemExit('register block missing')
          s=s.replace(old,new,1); p.write_text(s)
      - name: Verify
        run: python -m py_compile solo/bot/tournament_bot.py
      - name: Commit
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add solo/bot/tournament_bot.py
          git diff --cached --check
          git commit -m "fix: implement issue 21 Discord identity commands"
          git push origin HEAD
