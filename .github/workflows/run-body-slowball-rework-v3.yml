name: Run Body Builder and Slowballer rework v3
on:
  push:
    branches: [main]
permissions:
  contents: write
jobs:
  rework:
    if: github.event.head_commit.message != 'Apply Body Builder and Slowballer rework'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: python3 .github/rework_body_slowball_v3.py
