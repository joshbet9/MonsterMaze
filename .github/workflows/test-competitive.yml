name: Test Competitive Ratings

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  competitive-tests:
    name: Competitive rating tests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Run competitive tests
        working-directory: solo/bot
        run: python -m unittest test_competitive.py
