name: Deploy Monster Maze 1.8 to Hyper-V

on:
  push:
    branches: [main]
    paths:
      - '1.8/MonsterMazeStandalone/**'
      - '.github/workflows/deploy-hyperv-1-8.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: hyperv-monstermaze-18
  cancel-in-progress: false

jobs:
  deploy:
    name: Build, validate and deploy 1.8 plugin
    if: ${{ github.event_name != 'workflow_dispatch' || github.ref == 'refs/heads/main' }}
    runs-on: ubuntu-22.04
    environment: hyperv
    timeout-minutes: 35

    steps:
      - name: Check out the exact commit
        uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}

      - name: Set up Java 8
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '8'
          cache: maven

      - name: Download pinned BuildTools
        shell: bash
        env:
          BUILDTOOLS_URL: https://hub.spigotmc.org/jenkins/job/BuildTools/200/artifact/target/BuildTools.jar
        run: |
          set -euo pipefail
          curl -fsSL "$BUILDTOOLS_URL" -o "$RUNNER_TEMP/BuildTools.jar"

      - name: Build Spigot 1.8.8 dependency
        shell: bash
        working-directory: 1.8/MonsterMazeStandalone
        run: |
          set -euo pipefail
          java -Xmx2G -jar "$RUNNER_TEMP/BuildTools.jar" --rev 1.8.8 --output-dir "$RUNNER_TEMP/spigot"
          test -f "$RUNNER_TEMP/spigot/spigot-1.8.8.jar"
          mvn -B org.apache.maven.plugins:maven-install-plugin:3.1.4:install-file \
            -Dfile="$RUNNER_TEMP/spigot/spigot-1.8.8.jar" \
            -DgroupId=org.spigotmc -DartifactId=spigot \
            -Dversion=1.8.8-R0.1-SNAPSHOT -Dpackaging=jar

      - name: Build and validate embedded cosmetics testbed
        shell: bash
        working-directory: 1.8/MonsterMazeStandalone
        env:
          MAVEN_OPTS: '-Xmx2G'
        run: |
          set -euo pipefail
          mvn -B clean package
          jar tf target/MonsterMazeStandalone.jar | grep -Fxq 'me/monstermaze/cosmetics/PlayableArcadeTestbed.class'
          jar tf target/MonsterMazeStandalone.jar | grep -Fxq 'me/monstermaze/cosmetics/MinigameCosmeticPrototypes.class'
          jar tf target/MonsterMazeStandalone.jar | grep -Fxq 'plugin.yml'
          echo "Validated plugin SHA-256:"
          sha256sum target/MonsterMazeStandalone.jar

      - name: Connect runner to Hyper-V network
        uses: tailscale/github-action@v4
        with:
          oauth-client-id: ${{ secrets.TS_OAUTH_CLIENT_ID }}
          oauth-secret: ${{ secrets.TS_OAUTH_SECRET }}
          tags: tag:github-actions
          ping: 100.98.188.97

      - name: Prepare SSH credentials
        shell: bash
        env:
          SSH_PRIVATE_KEY: ${{ secrets.HYPERV_SSH_PRIVATE_KEY }}
          SSH_KNOWN_HOSTS: ${{ secrets.HYPERV_SSH_KNOWN_HOSTS }}
        run: |
          set -euo pipefail
          test -n "$SSH_PRIVATE_KEY" || { echo 'HYPERV_SSH_PRIVATE_KEY is not configured.' >&2; exit 1; }
          test -n "$SSH_KNOWN_HOSTS" || { echo 'HYPERV_SSH_KNOWN_HOSTS is not configured.' >&2; exit 1; }
          mkdir -p "$HOME/.ssh"
          chmod 700 "$HOME/.ssh"
          printf '%s\\n' "$SSH_PRIVATE_KEY" > "$HOME/.ssh/monstermaze_hyperv"
          printf '%s\\n' "$SSH_KNOWN_HOSTS" > "$HOME/.ssh/known_hosts"
          chmod 600 "$HOME/.ssh/monstermaze_hyperv" "$HOME/.ssh/known_hosts"

      - name: Upload tested plugin to Hyper-V
        shell: bash
        env:
          HYPERV_SSH_HOST: ${{ secrets.HYPERV_SSH_HOST }}
          HYPERV_SSH_USER: ${{ secrets.HYPERV_SSH_USER }}
          HYPERV_SSH_PORT: ${{ secrets.HYPERV_SSH_PORT }}
        run: |
          set -euo pipefail
          test -n "$HYPERV_SSH_HOST" || { echo 'HYPERV_SSH_HOST is not configured.' >&2; exit 1; }
          test -n "$HYPERV_SSH_USER" || { echo 'HYPERV_SSH_USER is not configured.' >&2; exit 1; }
          port="${HYPERV_SSH_PORT:-22}"
          scp -P "$port" -i "$HOME/.ssh/monstermaze_hyperv" \
            -o BatchMode=yes -o StrictHostKeyChecking=yes \
            -o UserKnownHostsFile="$HOME/.ssh/known_hosts" \
            "1.8/MonsterMazeStandalone/target/MonsterMazeStandalone.jar" \
            "$HYPERV_SSH_USER@$HYPERV_SSH_HOST:/tmp/MonsterMazeStandalone-${GITHUB_SHA}.jar"

      - name: Install plugin and restart only the Hyper-V 1.8 server
        shell: bash
        env:
          HYPERV_SSH_HOST: ${{ secrets.HYPERV_SSH_HOST }}
          HYPERV_SSH_USER: ${{ secrets.HYPERV_SSH_USER }}
          HYPERV_SSH_PORT: ${{ secrets.HYPERV_SSH_PORT }}
        run: |
          set -euo pipefail
          port="${HYPERV_SSH_PORT:-22}"
          ssh -p "$port" -i "$HOME/.ssh/monstermaze_hyperv" \
            -o BatchMode=yes -o StrictHostKeyChecking=yes \
            -o UserKnownHostsFile="$HOME/.ssh/known_hosts" \
            "$HYPERV_SSH_USER@$HYPERV_SSH_HOST" \
            "sudo -n bash -s -- '${GITHUB_SHA}'" <<'REMOTE'
          set -Eeuo pipefail
          SHA="$1"
          ROOT="/home/monstermaze/servers/1.8"
          PLUGIN="$ROOT/plugins/MonsterMazeStandalone.jar"
          SIDECAR="$ROOT/plugins/MinigameCosmeticPrototypes.jar"
          INCOMING="/tmp/MonsterMazeStandalone-${SHA}.jar"
          BACKUP_DIR="/home/monstermaze/deployment-backups/hyperv"
          PLUGIN_BACKUP="$BACKUP_DIR/MonsterMazeStandalone-${SHA}.jar"
          SIDECAR_BACKUP="$BACKUP_DIR/MinigameCosmeticPrototypes-${SHA}.jar"
          SERVICE="monstermaze-18.service"
          SIDECAR_EXISTED=0

          test -s "$INCOMING"
          test -s "$PLUGIN"
          systemctl is-active --quiet "$SERVICE"
          install -d -m 0750 "$BACKUP_DIR"
          cp -p "$PLUGIN" "$PLUGIN_BACKUP"
          if [[ -f "$SIDECAR" ]]; then
            cp -p "$SIDECAR" "$SIDECAR_BACKUP"
            SIDECAR_EXISTED=1
          fi

          rollback() {
            status=$?
            trap - EXIT
            if [[ "$status" -ne 0 ]]; then
              echo "Deployment failed; restoring the previous plugin and restarting the service." >&2
              systemctl stop "$SERVICE" || true
              if [[ -s "$PLUGIN_BACKUP" ]]; then
                cp -p "$PLUGIN_BACKUP" "$PLUGIN" || true
                chown monstermaze:monstermaze "$PLUGIN" || true
              fi
              if [[ "$SIDECAR_EXISTED" -eq 1 && -s "$SIDECAR_BACKUP" ]]; then
                cp -p "$SIDECAR_BACKUP" "$SIDECAR" || true
                chown monstermaze:monstermaze "$SIDECAR" || true
              fi
              systemctl start "$SERVICE" || true
              sleep 3
              journalctl -u "$SERVICE" -n 80 --no-pager || true
            fi
            rm -f "$INCOMING"
            exit "$status"
          }
          trap rollback EXIT

          systemctl stop "$SERVICE"
          install -o monstermaze -g monstermaze -m 0644 "$INCOMING" "$PLUGIN"
          # The embedded testbed replaces the old standalone plugin; keep its
          # backup outside the plugins directory and remove only the old JAR.
          rm -f "$SIDECAR"
          systemctl start "$SERVICE"
          sleep 10
          systemctl is-active --quiet "$SERVICE"
          if ! grep -Fq 'MonsterMazeStandalone enabled.' "$ROOT/logs/latest.log"; then
            echo "The server is active but the expected plugin startup line was not found." >&2
            tail -n 120 "$ROOT/logs/latest.log" >&2 || true
            exit 1
          fi

          echo "Hyper-V 1.8 deployment successful for commit $SHA"
          sha256sum "$PLUGIN"
          echo "Rollback backup: $PLUGIN_BACKUP"
          rm -f "$INCOMING"
          trap - EXIT
          REMOTE
