name: Deploy Oracle-only Monster Maze API

# Deliberately isolated from Release Monster Maze: these tags do not match
# the normal vX.Y.Z release workflow, so Fly and Hyper-V are never deployed.
on:
  push:
    tags:
      - 'oracle-v*.*.*'
  workflow_dispatch:
    inputs:
      tag:
        description: 'Existing oracle-vX.Y.Z tag to deploy to Oracle only'
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: oracle-only-${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.ref_name }}
  cancel-in-progress: false

env:
  RELEASE_TAG: ${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.ref_name }}

jobs:
  deploy:
    name: Test and deploy to Oracle only
    runs-on: ubuntu-22.04
    environment: oracle
    timeout-minutes: 15
    steps:
      - name: Validate Oracle-only release tag
        shell: bash
        env:
          RELEASE_TAG: ${{ env.RELEASE_TAG }}
        run: |
          set -euo pipefail
          [[ "$RELEASE_TAG" =~ ^oracle-v[0-9]+\.[0-9]+\.[0-9]+$ ]] || {
            echo "Expected an Oracle-only tag like oracle-v1.3.10, got: $RELEASE_TAG" >&2
            exit 1
          }

      - name: Check out the tagged source
        uses: actions/checkout@v4
        with:
          ref: ${{ env.RELEASE_TAG }}
          fetch-depth: 0

      - name: Confirm tag is on main
        shell: bash
        env:
          RELEASE_TAG: ${{ env.RELEASE_TAG }}
        run: |
          set -euo pipefail
          git fetch origin main --no-tags
          RELEASE_COMMIT="$(git rev-parse "${RELEASE_TAG}^{commit}")"
          if ! git merge-base --is-ancestor "$RELEASE_COMMIT" FETCH_HEAD; then
            echo "Refusing to deploy: ${RELEASE_TAG} is not a commit contained in main." >&2
            exit 1
          fi
          echo "RELEASE_COMMIT=$RELEASE_COMMIT" >> "$GITHUB_ENV"

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Run JNP Mod leaderboard API tests
        working-directory: solo/bot
        run: python -m unittest -v test_mod_leaderboards.py

      - name: Run Halloween Havoc/HHC community API tests
        working-directory: solo/bot
        run: python -m unittest -v test_mod_halloween_havoc.py

      - name: Prepare Oracle SSH credentials
        shell: bash
        env:
          SSH_PRIVATE_KEY: ${{ secrets.ORACLE_SSH_PRIVATE_KEY }}
          SSH_KNOWN_HOSTS: ${{ secrets.ORACLE_SSH_KNOWN_HOSTS }}
        run: |
          set -euo pipefail
          test -n "$SSH_PRIVATE_KEY" || { echo 'ORACLE_SSH_PRIVATE_KEY is not configured.' >&2; exit 1; }
          test -n "$SSH_KNOWN_HOSTS" || { echo 'ORACLE_SSH_KNOWN_HOSTS is not configured.' >&2; exit 1; }
          mkdir -p "$HOME/.ssh"
          chmod 700 "$HOME/.ssh"
          printf '%s\n' "$SSH_PRIVATE_KEY" > "$HOME/.ssh/monstermaze_oracle"
          printf '%s\n' "$SSH_KNOWN_HOSTS" > "$HOME/.ssh/oracle_known_hosts"
          chmod 600 "$HOME/.ssh/monstermaze_oracle" "$HOME/.ssh/oracle_known_hosts"

      - name: Verify Oracle SSH and service prerequisites
        shell: bash
        env:
          ORACLE_SSH_HOST: ${{ secrets.ORACLE_SSH_HOST }}
          ORACLE_SSH_USER: ${{ secrets.ORACLE_SSH_USER }}
          ORACLE_SSH_PORT: ${{ secrets.ORACLE_SSH_PORT }}
        run: |
          set -euo pipefail
          test -n "$ORACLE_SSH_HOST" || { echo 'ORACLE_SSH_HOST is not configured.' >&2; exit 1; }
          test -n "$ORACLE_SSH_USER" || { echo 'ORACLE_SSH_USER is not configured.' >&2; exit 1; }
          awk -v host="$ORACLE_SSH_HOST" 'NF >= 3 && $2 ~ /^ssh-/ { print host " " $2 " " $3 }' "$HOME/.ssh/oracle_known_hosts" > "$HOME/.ssh/known_hosts"
          test -s "$HOME/.ssh/known_hosts"
          port="${ORACLE_SSH_PORT:-22}"
          ssh -p "$port" -i "$HOME/.ssh/monstermaze_oracle" \
            -o BatchMode=yes -o StrictHostKeyChecking=yes \
            "$ORACLE_SSH_USER@$ORACLE_SSH_HOST" \
            'set -euo pipefail; sudo -n true; command -v git; command -v curl; command -v systemctl; test -f /etc/monstermaze-api.env; systemctl is-active --quiet monster-bot.service'

      - name: Deploy this release to Oracle only
        shell: bash
        env:
          ORACLE_SSH_HOST: ${{ secrets.ORACLE_SSH_HOST }}
          ORACLE_SSH_USER: ${{ secrets.ORACLE_SSH_USER }}
          ORACLE_SSH_PORT: ${{ secrets.ORACLE_SSH_PORT }}
          RELEASE_TAG: ${{ env.RELEASE_TAG }}
        run: |
          set -euo pipefail
          [[ "$RELEASE_COMMIT" =~ ^[0-9a-f]{40}$ ]] || { echo 'Validated release commit SHA is missing or invalid.' >&2; exit 1; }
          port="${ORACLE_SSH_PORT:-22}"
          ssh -p "$port" -i "$HOME/.ssh/monstermaze_oracle" \
            -o BatchMode=yes -o StrictHostKeyChecking=yes \
            "$ORACLE_SSH_USER@$ORACLE_SSH_HOST" \
            "bash -s -- ${RELEASE_TAG} ${RELEASE_COMMIT}" < ops/oracle/deploy-release.sh
