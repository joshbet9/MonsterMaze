name: Temporary Monster Maze kit rework
on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  rework:
    if: github.event.head_commit.message != 'Apply Body Builder and Slowballer rework'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Apply Body Builder and Slowballer rework
        shell: python
        run: |
          from pathlib import Path
          import re
          import subprocess

          kit_files = [
              Path('1.8/MonsterMazeStandalone/src/main/java/me/monstermaze/kit/KitManager.java'),
              Path('1.21/MonsterMazeStandalone/src/main/java/me/monstermaze/kit/KitManager.java'),
          ]
          mob_files = [
              Path('1.8/MonsterMazeStandalone/src/main/java/me/monstermaze/entity/MonsterManager.java'),
              Path('1.21/MonsterMazeStandalone/src/main/java/me/monstermaze/entity/MonsterManager.java'),
          ]

          def replace_once(text, old, new, label):
              count = text.count(old)
              if count != 1:
                  raise RuntimeError(f'{label}: expected 1 match, got {count}')
              return text.replace(old, new)

          body_block = r'''    // -------------------- Body Builder secondary: Body Rush --------------------
    // QOL-mode only. Two apples = two activations. Each activation consumes one apple and
    // starts a 10-second Body Rush. Every real mob contact removes exactly 2 seconds.

    @EventHandler
    public void onBodyRush(PlayerInteractEvent event) {
        if (game.getState() != GameState.LIVE) return;
        if (!game.qolEnabled()) return;
        Action a = event.getAction();
        if (a != Action.RIGHT_CLICK_AIR && a != Action.RIGHT_CLICK_BLOCK) return;

        Player player = event.getPlayer();
        if (getKit(player) != KitType.BODY_BUILDER) return;
        if (!game.getAlivePlayers().contains(player)) return;

        ItemStack hand = player.getItemInHand();
        if (hand == null || hand.getType() != Material.APPLE) return;

        long now = System.currentTimeMillis();
        Long until = bodyRushUntil.get(player.getUniqueId());
        if (until != null && until.longValue() > now) {
            event.setCancelled(true);
            return;
        }

        event.setCancelled(true);

        if (hand.getAmount() <= 1) player.setItemInHand(null);
        else {
            hand.setAmount(hand.getAmount() - 1);
            player.setItemInHand(hand);
        }

        bodyRushUntil.put(player.getUniqueId(), now + BODY_RUSH_DURATION_MS);
        bodyRushHitFeedback.remove(player.getUniqueId());
        bodyRushVisual(player);
        TextUtil.actionBar(player, ChatColor.RED + ChatColor.BOLD.toString() + "BODY RUSH 10.0s");
        Bukkit.getPluginManager().callEvent(new AbilityUseEvent(player));
    }

    public boolean isBodyRushActive(Player player) {
        if (!game.qolEnabled()) return false;
        Long until = bodyRushUntil.get(player.getUniqueId());
        if (until == null) return false;
        if (until.longValue() <= System.currentTimeMillis()) {
            bodyRushUntil.remove(player.getUniqueId());
            return false;
        }
        return true;
    }

    /** A real mob contact removes exactly 2 seconds from the current Body Rush. */
    public int consumeBodyRushUse(Player player) {
        UUID id = player.getUniqueId();
        long now = System.currentTimeMillis();
        Long until = bodyRushUntil.get(id);
        if (until == null || until.longValue() <= now) {
            bodyRushUntil.remove(id);
            return 0;
        }

        long remaining = until.longValue() - 2000L;
        bodyRushHitFeedback.put(id, now + 750L);
        bodyRushImpactVisual(player);
        if (remaining <= now) {
            bodyRushUntil.remove(id);
            return 0;
        }
        bodyRushUntil.put(id, remaining);
        return (int) Math.max(0L, remaining - now);
    }

    private static ItemStack bodyRushItem(int apples) {
        ItemStack item = new ItemStack(Material.APPLE, Math.max(1, apples));
        ItemMeta meta = item.getItemMeta();
        meta.setDisplayName(ChatColor.RED + "" + ChatColor.BOLD + "Body Rush");
        meta.setLore(java.util.Arrays.asList(
                ChatColor.GRAY + "Right Click to activate.",
                ChatColor.GRAY + "10 seconds of mob-contact immunity.",
                ChatColor.GRAY + "Each contact removes 2 seconds.",
                ChatColor.RED + "Activations: " + apples));
        item.setItemMeta(meta);
        return item;
    }

    private void bodyRushVisual(Player player) {
        // version-specific implementation is inserted by the rework script
    }

    private void bodyRushImpactVisual(Player player) {
        // version-specific implementation is inserted by the rework script
    }

    private void tickAbilityBars() {
        if (game.getState() != GameState.LIVE) return;
        long now = System.currentTimeMillis();
        for (Player p : game.getAlivePlayers()) {
            UUID id = p.getUniqueId();
            Long body = bodyRushUntil.get(id);
            if (body != null && body.longValue() > now) {
                double secs = (body.longValue() - now) / 1000.0;
                Long feedback = bodyRushHitFeedback.get(id);
                String suffix = feedback != null && feedback.longValue() > now ? "  " + ChatColor.YELLOW + "-2.0s" : "";
                TextUtil.actionBar(p, ChatColor.RED + ChatColor.BOLD.toString() + "BODY RUSH " + String.format(java.util.Locale.US, "%.1fs", secs) + suffix);
                continue;
            }
            if (body != null) bodyRushUntil.remove(id);
            bodyRushHitFeedback.remove(id);
            if (getKit(p) != KitType.SLOWBALL) continue;
            Long frozen = cryoFrozenUntil.get(id);
            if (frozen != null && frozen.longValue() > now) {
                TextUtil.actionBar(p, ChatColor.AQUA + ChatColor.BOLD.toString() + "FROZEN " + String.format(java.util.Locale.US, "%.1fs", (frozen.longValue() - now) / 1000.0));
                continue;
            }
            cryoFrozenUntil.remove(id);
            Long last = cryoCooldown.get(id);
            if (last == null) {
                TextUtil.actionBar(p, ChatColor.AQUA + ChatColor.BOLD.toString() + "CRYO BLITZ READY");
            } else {
                long left = (last.longValue() + CRYO_COOLDOWN_MS) - now;
                if (left <= 0) {
                    cryoCooldown.remove(id);
                    TextUtil.actionBar(p, ChatColor.AQUA + ChatColor.BOLD.toString() + "CRYO BLITZ READY");
                } else {
                    TextUtil.actionBar(p, ChatColor.AQUA + ChatColor.BOLD.toString() + "CRYO BLITZ " + String.format(java.util.Locale.US, "%.1fs", left / 1000.0));
                }
            }
        }
    }

    // -------------------- Slowballer secondary: Cryo Blitz --------------------'''

          for p in kit_files:
              s = p.read_text(encoding='utf-8')
              s = replace_once(s, 'private final Map<UUID, Integer> bodyRushUses = new HashMap<UUID, Integer>();', '''private final Map<UUID, Long> bodyRushUntil = new HashMap<UUID, Long>();
    /** Short-lived impact feedback timestamp for Body Rush. */
    private final Map<UUID, Long> bodyRushHitFeedback = new HashMap<UUID, Long>();
    /** Player -> Cryo freeze feedback expiry. */
    private final Map<UUID, Long> cryoFrozenUntil = new HashMap<UUID, Long>();''', f'{p}: state')
              s = s.replace('bodyRushUses', 'bodyRushUntil')
              s = s.replace('private static final int BODY_RUSH_MAX_USES = 5;', 'private static final long BODY_RUSH_DURATION_MS = 10000L;')
              s = s.replace('CRYO_COOLDOWN_MS = 60000', 'CRYO_COOLDOWN_MS = 30000')
              s = s.replace('CRYO_RADIUS = 5', 'CRYO_RADIUS = 6')
              s = replace_once(s, '''                jumpEvent();
                repulseCleanup();''', '''                jumpEvent();
                repulseCleanup();
                tickAbilityBars();''', f'{p}: ticker')
              s, n = re.subn(r'    // -------------------- Body Builder secondary: Body Rush --------------------.*?    // -------------------- Slowballer secondary: Cryo Blitz --------------------', body_block, s, count=1, flags=re.S)
              if n != 1:
                  raise RuntimeError(f'{p}: Body Rush block not found')
              s = s.replace('player.getInventory().setItem(0, bodyRushItem(BODY_RUSH_MAX_USES));', 'player.getInventory().setItem(0, bodyRushItem(2));')
              s = s.replace('bodyRushUntil.clear();', 'bodyRushUntil.clear();\n        bodyRushHitFeedback.clear();\n        cryoFrozenUntil.clear();')
              s = s.replace('bodyRushUntil.remove(player.getUniqueId());\n        cryoCooldown.remove(player.getUniqueId());', 'bodyRushUntil.remove(player.getUniqueId());\n        bodyRushHitFeedback.remove(player.getUniqueId());\n        cryoFrozenUntil.remove(player.getUniqueId());\n        cryoCooldown.remove(player.getUniqueId());')
              s = s.replace('bodyRushUntil.remove(id);\n        cryoCooldown.remove(id);', 'bodyRushUntil.remove(id);\n        bodyRushHitFeedback.remove(id);\n        cryoFrozenUntil.remove(id);\n        cryoCooldown.remove(id);')
              if '1.21/' in str(p):
                  s = s.replace('player.getItemInHand()', 'player.getInventory().getItemInMainHand()')
                  s = s.replace('player.setItemInHand(null)', 'player.getInventory().setItemInMainHand(null)')
                  s = s.replace('player.setItemInHand(hand)', 'player.getInventory().setItemInMainHand(hand)')
                  s = s.replace('''    private void bodyRushVisual(Player player) {
        // version-specific implementation is inserted by the rework script
    }''', '''    private void bodyRushVisual(Player player) {
        player.playSound(player.getLocation(), Sound.ENTITY_PLAYER_LEVELUP, 1.0f, 1.25f);
        player.getWorld().spawnParticle(Particle.FLAME, player.getLocation().add(0, 1, 0), 24, 0.35, 0.55, 0.35, 0.03);
    }''')
                  s = s.replace('''    private void bodyRushImpactVisual(Player player) {
        // version-specific implementation is inserted by the rework script
    }''', '''    private void bodyRushImpactVisual(Player player) {
        player.playSound(player.getLocation(), Sound.ENTITY_IRON_GOLEM_HURT, 1.0f, 1.35f);
        player.getWorld().spawnParticle(Particle.CRIT, player.getLocation().add(0, 1, 0), 12, 0.25, 0.35, 0.25, 0.05);
    }''')
                  cryo_visual = '''    private void cryoVisual(Player player) {
        player.playSound(player.getLocation(), Sound.BLOCK_GLASS_BREAK, 1.0f, 0.7f);
        player.getWorld().spawnParticle(Particle.SNOWFLAKE, player.getLocation().add(0, 1, 0), 80, 3.0, 1.0, 3.0, 0.04);
    }'''
              else:
                  s = s.replace('''    private void bodyRushVisual(Player player) {
        // version-specific implementation is inserted by the rework script
    }''', '''    private void bodyRushVisual(Player player) {
        player.playSound(player.getLocation(), Sound.SUCCESSFUL_HIT, 1.0f, 1.25f);
        player.getWorld().playEffect(player.getLocation(), Effect.MOBSPAWNER_FLAMES, 0);
    }''')
                  s = s.replace('''    private void bodyRushImpactVisual(Player player) {
        // version-specific implementation is inserted by the rework script
    }''', '''    private void bodyRushImpactVisual(Player player) {
        player.playSound(player.getLocation(), Sound.HURT_FLESH, 1.0f, 1.35f);
        player.getWorld().playEffect(player.getLocation(), Effect.MOBSPAWNER_FLAMES, 0);
    }''')
                  cryo_visual = '''    private void cryoVisual(Player player) {
        player.playSound(player.getLocation(), Sound.GLASS_BREAK, 1.0f, 0.7f);
        player.getWorld().playEffect(player.getLocation(), Effect.SNOWBALL_BREAK, 0);
    }'''
              s = s.replace('    private ItemStack slowballItem(UUID playerId, int amount) {', cryo_visual + '\n\n    private ItemStack slowballItem(UUID playerId, int amount) {', 1)
              marker = '''        TextUtil.title(player, "", ChatColor.AQUA + "" + ChatColor.BOLD + "Cryo Blitz!"
                        + ChatColor.WHITE + " " + frozenCount + " mob(s) frozen", 5, 30, 5);'''
              if marker not in s:
                  raise RuntimeError(f'{p}: Cryo title marker not found')
              s = s.replace(marker, marker + '''
        if (frozenCount > 0) cryoFrozenUntil.put(player.getUniqueId(), now + CRYO_FREEZE_MS);
        cryoVisual(player);''', 1)
              p.write_text(s, encoding='utf-8')

          for p in mob_files:
              s = p.read_text(encoding='utf-8')
              s = replace_once(s, '''        for (Player player : players) {
            if (!canBump(player)) continue;
            if (game.isOnAnyPad(player)) continue;''', '''        for (Player player : players) {
            if (game.isOnAnyPad(player)) continue;
            me.monstermaze.kit.KitManager km = game.getKitManager();
            boolean bodyRush = km != null && km.isBodyRushActive(player);
            if (!bodyRush && !canBump(player)) continue;''', f'{p}: cooldown bypass')
              s = replace_once(s, '''                LivingEntity ent = mobs[i];
                markBump(player);

                // Body Builder Body Rush (QOL only): a contacting mob is deflected away like a
                // Repulsor launch — no knockback, no damage, full immunity — and consumes one use.
                me.monstermaze.kit.KitManager km = game.getKitManager();
                if (km != null && km.isBodyRushActive(player)) {''', '''                LivingEntity ent = mobs[i];

                // Body Rush bypasses the normal one-second bump cooldown.
                if (bodyRush) {''', f'{p}: contact ordering')
              s = replace_once(s, '''                // Anti-bonk, ping-independent: lift the player ABOVE the maze floor before applying''', '''                // Normal mob contact retains the original one-second bump cooldown.
                markBump(player);

                // Anti-bonk, ping-independent: lift the player ABOVE the maze floor before applying''', f'{p}: normal cooldown mark')
              p.write_text(s, encoding='utf-8')

          for p in kit_files:
              s = p.read_text(encoding='utf-8')
              if 'BODY_RUSH_MAX_USES' in s or 'bodyRushUses' in s:
                  raise RuntimeError(f'{p}: old Body Rush implementation remains')
              if 'CRYO_COOLDOWN_MS = 60000' in s or 'CRYO_RADIUS = 5' in s:
                  raise RuntimeError(f'{p}: old Cryo constants remain')

          subprocess.run(['git','config','user.name','MonsterMaze Bot'], check=True)
          subprocess.run(['git','config','user.email','monstermaze-bot@users.noreply.github.com'], check=True)
          Path('.github/workflows/apply-body-slowball-rework.yml').unlink(missing_ok=True)
          subprocess.run(['git','add'] + [str(p) for p in kit_files + mob_files] + ['.github/workflows/apply-body-slowball-rework.yml'], check=True)
          subprocess.run(['git','commit','-m','Apply Body Builder and Slowballer rework'], check=True)
          subprocess.run(['git','push','origin','main'], check=True)
