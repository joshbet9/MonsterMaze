name: Test Release Monster Maze 1.21

on:
  push:
    tags:
      - 'v*.*.*.test'

permissions:
  contents: write
  packages: read

env:
  RELEASE_TAG: ${{ github.ref_name }}
  PROTOCOLLIB_URL: 'https://github.com/dmulloy2/ProtocolLib/releases/download/5.4.0/ProtocolLib.jar'

jobs:
  build-publish-deploy:
    name: Build, publish and deploy 1.21 test release
    runs-on: ubuntu-22.04
    environment: hyperv
    timeout-minutes: 60

    steps:
      - name: Checkout tagged source
        uses: actions/checkout@v5
        with:
          ref: ${{ env.RELEASE_TAG }}
          fetch-depth: 0

      - name: Validate test release ref
        shell: bash
        run: |
          set -euo pipefail
          [[ "$RELEASE_TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+\.test$ ]] || {
            echo "Test release tag must match vX.Y.Z.test; got '$RELEASE_TAG'." >&2
            exit 1
          }
          commit="$(git rev-parse HEAD)"
          tag_commit="$(git rev-list -n 1 "$RELEASE_TAG")"
          [[ "$commit" == "$tag_commit" ]] || {
            echo 'Checkout is not exactly the requested test tag commit.' >&2
            exit 1
          }
          echo "Building immutable test source ref $RELEASE_TAG at $commit"

      - name: Setup Java 21
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'
          cache: maven

      - name: Download stable Paper 1.21.11
        shell: pwsh
        run: |
          $headers = @{ 'User-Agent' = 'MonsterMaze-TestRelease/1.0 (https://github.com/joshbet9/MonsterMaze)' }
          $builds = Invoke-RestMethod -Uri 'https://fill.papermc.io/v3/projects/paper/versions/1.21.11/builds' -Headers $headers
          $stable = @($builds | Where-Object { $_.channel -eq 'STABLE' } | Sort-Object id -Descending | Select-Object -First 1)
          if ($stable.Count -ne 1) { throw 'No stable Paper 1.21.11 build was returned.' }
          $download = $stable[0].downloads.'server:default'
          $paper = Join-Path $env:RUNNER_TEMP $download.name
          Invoke-WebRequest -Uri $download.url -Headers $headers -OutFile $paper
          $actual = (Get-FileHash $paper -Algorithm SHA256).Hash.ToLowerInvariant()
          if ($actual -ne $download.checksums.sha256.ToLowerInvariant()) { throw 'Paper SHA-256 mismatch.' }
          "MM_PAPER_JAR=$paper" | Out-File $env:GITHUB_ENV -Append -Encoding utf8

      - name: Download ProtocolLib 5.4.0
        shell: pwsh
        run: |
          $protocol = Join-Path $env:RUNNER_TEMP 'ProtocolLib.jar'
          Invoke-WebRequest -Uri $env:PROTOCOLLIB_URL -OutFile $protocol
          if (-not (Test-Path $protocol)) { throw 'ProtocolLib download failed.' }
          "MM_PROTOCOLLIB_JAR=$protocol" | Out-File $env:GITHUB_ENV -Append -Encoding utf8

      - name: Build and test 1.21
        shell: bash
        working-directory: 1.21/MonsterMazeStandalone
        env:
          MAVEN_OPTS: '-Xmx2G'
        run: |
          set -euo pipefail
          mvn -B clean package
          test -f target/MonsterMazeStandalone.jar

      - name: Package Solo 1.21 test distribution
        shell: pwsh
        working-directory: solo/1.21
        env:
          MM_RELEASE_VERSION: ${{ env.RELEASE_TAG }}
          MM_RELEASE_NOTE: 'Monster Maze 1.21 Hyper-V test release for integration verification.'
          MM_RELEASE_SOURCE_BASE_URL: https://raw.githubusercontent.com/joshbet9/MonsterMaze/refs/tags/${{ env.RELEASE_TAG }}/solo/1.21
          MM_RELEASE_ASSET_BASE_URL: https://github.com/joshbet9/MonsterMaze/releases/download/${{ env.RELEASE_TAG }}
        run: |
          ./pack.ps1 -ReleaseVersion $env:RELEASE_TAG -ReleaseNote $env:MM_RELEASE_NOTE -SkipBuild
          if ($LASTEXITCODE -ne 0) { throw "1.21 Solo packaging failed with exit code $LASTEXITCODE." }
          Copy-Item -Force ./solo-1.21-dist.zip ../../MonsterMaze-Test-1.21-Solo.zip
          Copy-Item -Force ./version.json ../../MonsterMaze-Test-1.21-version.json
          Copy-Item -Force ./solo-dist/server/plugins/MonsterMazeStandalone.jar ../../MonsterMaze-Test-1.21-plugin.jar
          Copy-Item -Force ./solo-dist/server/plugins/ProtocolLib.jar ../../MonsterMaze-Test-1.21-ProtocolLib.jar
          Copy-Item -Force ./solo-dist/server/paper-1.21.11.jar ../../MonsterMaze-Test-1.21-Paper.jar

      - name: Build Hyper-V hosted server artifact
        shell: pwsh
        working-directory: ${{ github.workspace }}
        run: |
          $root = Join-Path $env:GITHUB_WORKSPACE 'test-server/1.21/server'
          New-Item -ItemType Directory -Force -Path $root | Out-Null
          Copy-Item -Recurse -Force 'solo/1.21/solo-dist/server/*' $root
          Copy-Item -Force 'docker/deployments/fly/1.21/config.yml' "$root/plugins/MonsterMazeStandalone/config.yml"
          Remove-Item -Recurse -Force "$root/world", "$root/logs", "$root/plugins/MonsterMazeStandalone/solo-runs" -ErrorAction SilentlyContinue
          $config = Get-Content "$root/plugins/MonsterMazeStandalone/config.yml" -Raw
          if ($config -notmatch '(?m)^solo-mode:\s*false\s*$') { throw 'Test hosted artifact is not solo-mode:false.' }
          if (Test-Path "$root/.env") { throw 'Test hosted artifact contains .env.' }
          Compress-Archive -Path "$root/*" -DestinationPath 'MonsterMaze-Test-Server-1.21.zip' -CompressionLevel Optimal

      - name: Create test release checksums
        shell: pwsh
        run: |
          $assets = @(
            'MonsterMaze-Test-1.21-Solo.zip',
            'MonsterMaze-Test-1.21-version.json',
            'MonsterMaze-Test-1.21-plugin.jar',
            'MonsterMaze-Test-1.21-ProtocolLib.jar',
            'MonsterMaze-Test-1.21-Paper.jar',
            'MonsterMaze-Test-Server-1.21.zip'
          )
          $lines = foreach ($asset in $assets) {
            if (-not (Test-Path $asset)) { throw "Missing release asset: $asset" }
            $hash = (Get-FileHash $asset -Algorithm SHA256).Hash.ToLowerInvariant()
            "$hash  $asset"
          }
          $lines | Set-Content SHA256SUMS.txt -Encoding ascii
          Get-Content SHA256SUMS.txt

      - name: Publish GitHub test release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          gh release create "$RELEASE_TAG" \
            MonsterMaze-Test-1.21-Solo.zip \
            MonsterMaze-Test-1.21-version.json \
            MonsterMaze-Test-1.21-plugin.jar \
            MonsterMaze-Test-1.21-ProtocolLib.jar \
            MonsterMaze-Test-1.21-Paper.jar \
            MonsterMaze-Test-Server-1.21.zip \
            SHA256SUMS.txt \
            --title "Monster Maze $RELEASE_TAG (Hyper-V test)" \
            --notes "Temporary Hyper-V integration release for testing the current 1.21 build. This release must not be used for production deployment." \
            --prerelease \
            --verify-tag

      - name: Connect runner to Tailscale
        uses: tailscale/github-action@v4
        with:
          oauth-client-id: ${{ secrets.TS_OAUTH_CLIENT_ID }}
          oauth-secret: ${{ secrets.TS_OAUTH_SECRET }}
          tags: tag:github-actions
          ping: 100.98.188.97

      - name: Prepare SSH credentials
        shell: bash
        env:
          SSH_PRIVATE_KEY: ${{ secrets.HYPERV_SSH_PRIVATE_KEY }}
          SSH_KNOWN_HOSTS: ${{ secrets.HYPERV_SSH_KNOWN_HOSTS }}
        run: |
          set -euo pipefail
          test -n "$SSH_PRIVATE_KEY"
          test -n "$SSH_KNOWN_HOSTS"
          mkdir -p "$HOME/.ssh"
          chmod 700 "$HOME/.ssh"
          printf '%s\n' "$SSH_PRIVATE_KEY" > "$HOME/.ssh/monstermaze_hyperv"
          printf '%s\n' "$SSH_KNOWN_HOSTS" > "$HOME/.ssh/known_hosts"
          chmod 600 "$HOME/.ssh/monstermaze_hyperv" "$HOME/.ssh/known_hosts"

      - name: Verify Hyper-V SSH and runtime
        shell: bash
        env:
          HYPERV_SSH_HOST: ${{ secrets.HYPERV_SSH_HOST }}
          HYPERV_SSH_USER: ${{ secrets.HYPERV_SSH_USER }}
          HYPERV_SSH_PORT: ${{ secrets.HYPERV_SSH_PORT }}
        run: |
          set -euo pipefail
          port="${HYPERV_SSH_PORT:-22}"
          test -n "$HYPERV_SSH_HOST"
          test -n "$HYPERV_SSH_USER"
          ssh -p "$port" -i "$HOME/.ssh/monstermaze_hyperv" -o BatchMode=yes \
            "${HYPERV_SSH_USER}@${HYPERV_SSH_HOST}" \
            'set -euo pipefail; sudo -n true; command -v curl; command -v unzip; command -v rsync; command -v sha256sum; command -v systemctl; test -x /usr/lib/jvm/java-21-openjdk-amd64/bin/java || test -x /usr/lib/jvm/temurin-21-jdk-amd64/bin/java'

      - name: Deploy 1.21 test release to Hyper-V
        shell: bash
        env:
          HYPERV_SSH_HOST: ${{ secrets.HYPERV_SSH_HOST }}
          HYPERV_SSH_USER: ${{ secrets.HYPERV_SSH_USER }}
          HYPERV_SSH_PORT: ${{ secrets.HYPERV_SSH_PORT }}
        run: |
          set -euo pipefail
          port="${HYPERV_SSH_PORT:-22}"
          ssh -p "$port" -i "$HOME/.ssh/monstermaze_hyperv" -o BatchMode=yes \
            "${HYPERV_SSH_USER}@${HYPERV_SSH_HOST}" \
            "curl -fsSL https://raw.githubusercontent.com/joshbet9/MonsterMaze/refs/tags/${RELEASE_TAG}/ops/hyperv/deploy-test-release-1.21.sh | bash -s -- ${RELEASE_TAG}"
