name: Finalize issue fixes
on:
  push:
    branches: [automation/issue-fixes-5-7-18-20-21]
permissions:
  contents: write
jobs:
  finalize:
    if: "${{ github.event.head_commit.message == 'chore: finalize issue fixes' }}"
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Finalize source
        shell: python
        run: |
          from pathlib import Path
          p=Path('solo/bot/tournament_bot.py')
          s=p.read_text()
          if 'import re\n' not in s:
              s=s.replace('import time\n','import time\nimport re\n',1)
          p.write_text(s)
      - name: Verify all requested fixes
        shell: bash
        run: |
          set -euo pipefail
          python -m py_compile solo/bot/competitive.py solo/bot/tournament_bot.py
          grep -q 'playersOnPad.contains(p)' 1.8/MonsterMazeStandalone/src/main/java/me/monstermaze/game/GameManager.java
          grep -q 'playersOnPad.contains(p)' 1.21/MonsterMazeStandalone/src/main/java/me/monstermaze/game/GameManager.java
          grep -q 'if (!game.qolEnabled()) continue;' 1.8/MonsterMazeStandalone/src/main/java/me/monstermaze/kit/KitManager.java
          grep -q 'if (!game.qolEnabled()) continue;' 1.21/MonsterMazeStandalone/src/main/java/me/monstermaze/kit/KitManager.java
          grep -q 'setCollidable(false)' 1.21/MonsterMazeStandalone/src/main/java/me/monstermaze/game/GameManager.java
          grep -q 'setCollidable(true)' 1.21/MonsterMazeStandalone/src/main/java/me/monstermaze/game/GameManager.java
          grep -q 'p.getInventory().clear()' 1.21/MonsterMazeStandalone/src/main/java/me/monstermaze/game/GameManager.java
          grep -q 'event.setCancelled(true); return;' 1.21/MonsterMazeStandalone/src/main/java/me/monstermaze/game/ArenaListener.java
          grep -q 'SELECT uuid,MAX(name)' solo/bot/competitive.py
          grep -q 'ensure_player(c,sid,u,name)' solo/bot/competitive.py
          grep -q 'discord_minecraft_identity' solo/bot/tournament_bot.py
          grep -q 'import re' solo/bot/tournament_bot.py
      - name: Commit and remove finalizer
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add solo/bot/tournament_bot.py
          git diff --cached --check
          git commit -m "fix: finalize issue 21 identity validation"
          git rm .github/workflows/finalize-issue-fixes.yml .github/issue-fix-trigger .github/trigger2 2>/dev/null || true
          git commit -m "chore: remove issue fix automation" || true
          git push origin HEAD
