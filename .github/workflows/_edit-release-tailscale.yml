name: Temporary release workflow editor

on:
  push:
    branches:
      - main
    paths:
      - '.github/workflows/_edit-release-tailscale.yml'

permissions:
  contents: write

jobs:
  edit:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Patch release workflow
        shell: python
        run: |
          from pathlib import Path
          p = Path('.github/workflows/release.yml')
          text = p.read_text()
          addition = '''      - name: Connect runner to Tailscale
        uses: tailscale/github-action@v4
        with:
          oauth-client-id: ${{ secrets.TS_OAUTH_CLIENT_ID }}
          oauth-secret: ${{ secrets.TS_OAUTH_SECRET }}
          tags: tag:github-actions
          ping: 100.98.188.97

'''
          needle = '      - name: Deploy immutable release to Hyper-V\n'
          if addition in text:
              raise SystemExit('Tailscale step already present.')
          if needle not in text:
              raise SystemExit('Hyper-V deploy step not found.')
          p.write_text(text.replace(needle, addition + needle))

      - name: Commit release workflow change
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add .github/workflows/release.yml
          git commit -m 'ci: connect Hyper-V deployment through Tailscale'
          git push origin HEAD:main
