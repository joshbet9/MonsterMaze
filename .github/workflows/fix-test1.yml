name: Fix Test 1 compile compatibility

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  fix:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Restore MonsterManager API and add 10Hz navigation throttle
        shell: python
        run: |
          from pathlib import Path
          p = Path('1.8/MonsterMazeStandalone/src/main/java/me/monstermaze/entity/MonsterManager.java')
          s = p.read_text()
          if 'public void launch(LivingEntity ent, Vector velocity)' not in s:
              s = s.replace('    private void tickLaunched() {', '''    public void launch(LivingEntity ent, Vector velocity) {\n        if (!ents.containsKey(ent)) return;\n        frozen.remove(ent);\n        ent.setVelocity(velocity);\n        launched.put(ent, System.currentTimeMillis());\n    }\n\n    public Iterable<LivingEntity> getMonsters() {\n        return ents.keySet();\n    }\n\n    public void freeze(LivingEntity ent, long thawAt) {\n        if (!ents.containsKey(ent)) return;\n        launched.remove(ent);\n        frozen.put(ent, thawAt);\n    }\n\n    private void tickLaunched() {''')
          marker = '            if (offset2d(ent.getLocation(), wp.Target) < 0.4) {'
          if 'navigationTick' not in s:
              s = s.replace('    private void move() {\n        if (maze == null) return;\n', '    /** TEST: actual movement remains 20Hz; expensive navigation decisions run at 10Hz. */\n    private int navigationTick;\n\n    private void move() {\n        if (maze == null) return;\n        navigationTick++;\n        boolean recalculateNavigation = (navigationTick & 1) == 1;\n')
              s = s.replace(marker, '            if (recalculateNavigation && offset2d(ent.getLocation(), wp.Target) < 0.4) {', 1)
          p.write_text(s)
      - name: Commit fix
        run: |
          git config user.name 'MonsterMaze Bot'
          git config user.email 'monstermaze-bot@users.noreply.github.com'
          git add 1.8/MonsterMazeStandalone/src/main/java/me/monstermaze/entity/MonsterManager.java
          git diff --cached --quiet || git commit -m 'TEST: fix MonsterManager API for 10Hz navigation test'
          git push