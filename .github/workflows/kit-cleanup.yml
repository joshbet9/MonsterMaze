name: Kit Cleanup

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  cleanup:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Rename Body Rush timer method and clean comments
        run: |
          python3 - <<'PY'
          from pathlib import Path

          files = [
              Path('1.8/MonsterMazeStandalone/src/main/java/me/monstermaze/kit/KitManager.java'),
              Path('1.21/MonsterMazeStandalone/src/main/java/me/monstermaze/kit/KitManager.java'),
              Path('1.8/MonsterMazeStandalone/src/main/java/me/monstermaze/entity/MonsterManager.java'),
              Path('1.21/MonsterMazeStandalone/src/main/java/me/monstermaze/entity/MonsterManager.java'),
          ]

          for path in files:
              text = path.read_text(encoding='utf-8')
              text = text.replace('consumeBodyRushUse', 'reduceBodyRushTime')

              if path.name == 'KitManager.java':
                  old = '''    /** Body Builder "Body Rush" secondary: remaining deflects (0/absent = inactive).\n     *  Right-click activates a persistent buff; each mob contact deflects the mob away and\n     *  decrements one use, granting the player full bump immunity while the counter is > 0. */'''
                  new = '''    /**\n     * Body Builder "Body Rush" secondary.\n     * Right-click activates a 10-second mob-contact immunity; each mob contact removes 2 seconds.\n     */'''
                  text = text.replace(old, new)

                  old2 = '''    /** A real mob contact removes exactly 2 seconds from Body Rush. */'''
                  new2 = '''    /** A real mob contact removes exactly 2 seconds from the remaining Body Rush timer. */'''
                  text = text.replace(old2, new2)

              path.write_text(text, encoding='utf-8', newline='\\n')
          PY

      - name: Commit cleanup
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add 1.8/MonsterMazeStandalone/src/main/java/me/monstermaze/kit/KitManager.java 1.21/MonsterMazeStandalone/src/main/java/me/monstermaze/kit/KitManager.java 1.8/MonsterMazeStandalone/src/main/java/me/monstermaze/entity/MonsterManager.java 1.21/MonsterMazeStandalone/src/main/java/me/monstermaze/entity/MonsterManager.java
          git diff --cached --quiet && exit 0
          git commit -m "Clean up Body Rush timer naming and comments"
          git push

      - name: Remove temporary workflow
        if: always()
        run: |
          git rm .github/workflows/kit-cleanup.yml
          git commit -m "Remove temporary kit cleanup workflow"
          git push
