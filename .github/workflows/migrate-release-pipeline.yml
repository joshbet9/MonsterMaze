name: Migrate release pipeline

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/migrate-release-pipeline.yml'

permissions:
  contents: write

jobs:
  migrate:
    runs-on: ubuntu-22.04
    steps:
      - name: Rewrite release workflow
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          export GH_REPO="${GITHUB_REPOSITORY}"
          gh api "repos/${GH_REPO}/contents/.github/workflows/release.yml?ref=main" > /tmp/release.json
          gh api "repos/${GH_REPO}/contents/.github/workflows/deploy-oracle.yml?ref=main" > /tmp/oracle.json || true
          python3 <<'PY'
          import base64, json, re, os
          from pathlib import Path

          release = json.loads(Path('/tmp/release.json').read_text())
          text = base64.b64decode(release['content']).decode('utf-8')

          if 'preflight-oracle:' not in text:
              oracle_preflight = r'''  preflight-oracle:
              name: Preflight Oracle bot/API deployment
              runs-on: ubuntu-22.04
              environment: oracle
              timeout-minutes: 10
              steps:
                - name: Prepare SSH credentials
                  shell: bash
                  env:
                    SSH_PRIVATE_KEY: ${{ secrets.ORACLE_SSH_PRIVATE_KEY }}
                    SSH_KNOWN_HOSTS: ${{ secrets.ORACLE_SSH_KNOWN_HOSTS }}
                  run: |
                    set -euo pipefail
                    test -n "$SSH_PRIVATE_KEY" || { echo 'ORACLE_SSH_PRIVATE_KEY is not configured.' >&2; exit 1; }
                    test -n "$SSH_KNOWN_HOSTS" || { echo 'ORACLE_SSH_KNOWN_HOSTS is not configured.' >&2; exit 1; }
                    mkdir -p "$HOME/.ssh"
                    chmod 700 "$HOME/.ssh"
                    printf '%s\n' "$SSH_PRIVATE_KEY" > "$HOME/.ssh/monstermaze_oracle"
                    printf '%s\n' "$SSH_KNOWN_HOSTS" > "$HOME/.ssh/oracle_known_hosts"
                    chmod 600 "$HOME/.ssh/monstermaze_oracle" "$HOME/.ssh/oracle_known_hosts"

                - name: Verify Oracle SSH, sudo, runtime, service, and API config
                  shell: bash
                  env:
                    ORACLE_SSH_HOST: ${{ secrets.ORACLE_SSH_HOST }}
                    ORACLE_SSH_USER: ${{ secrets.ORACLE_SSH_USER }}
                    ORACLE_SSH_PORT: ${{ secrets.ORACLE_SSH_PORT }}
                  run: |
                    set -euo pipefail
                    test -n "$ORACLE_SSH_HOST" || { echo 'ORACLE_SSH_HOST is not configured.' >&2; exit 1; }
                    test -n "$ORACLE_SSH_USER" || { echo 'ORACLE_SSH_USER is not configured.' >&2; exit 1; }
                    port="${ORACLE_SSH_PORT:-22}"
                    awk -v host="$ORACLE_SSH_HOST" 'NF >= 3 && $2 ~ /^ssh-/ { print host " " $2 " " $3 }' "$HOME/.ssh/oracle_known_hosts" > "$HOME/.ssh/known_hosts"
                    test -s "$HOME/.ssh/known_hosts" || { echo 'Oracle known_hosts contains no usable host keys.' >&2; exit 1; }
                    ssh -p "$port" -i "$HOME/.ssh/monstermaze_oracle" -o BatchMode=yes -o StrictHostKeyChecking=yes \
                      "${ORACLE_SSH_USER}@${ORACLE_SSH_HOST}" \
                      'set -euo pipefail; sudo -n true; command -v git; command -v curl; command -v systemctl; test -f /etc/monstermaze-api.env; systemctl is-active --quiet monster-bot.service'

'''
              text = text.replace('  release:\n', oracle_preflight + '  release:\n', 1)

          text = text.replace('needs: [preflight-fly, preflight-hyperv]', 'needs: [preflight-fly, preflight-hyperv, preflight-oracle]', 1)

          publish_pattern = re.compile(r"\n      - name: Publish GitHub Release\n.*?--verify-tag\n", re.S)
          text, count = publish_pattern.subn('', text, count=1)
          if count != 1:
              raise SystemExit('Could not remove existing Publish GitHub Release step.')

          upload = r'''\n      - name: Upload release assets for final publication
        uses: actions/upload-artifact@v4
        with:
          name: release-assets
          retention-days: 1
          path: |
            solo/MonsterMaze-Solo.zip
            solo/solo-1.8-version.json
            MonsterMaze-Solo-1.8-plugin.jar
            solo/1.21/1.21-MonsterMaze-Solo.zip
            solo/1.21/solo-1.21-version.json
            MonsterMaze-Solo-1.21-plugin.jar
            MonsterMaze-Solo-1.21-Paper.jar
            MonsterMaze-Solo-1.21-ProtocolLib.jar
            MonsterMaze-Server-1.8.zip
            MonsterMaze-Server-1.21.zip
            DOCKER-IMAGE.txt
            SHA256SUMS.txt
'''
          text = text.replace('\n  deploy-fly:\n', upload + '\n  deploy-fly:\n', 1)

          if 'deploy-oracle:' not in text:
              oracle_job = r'''\n\n  deploy-oracle:
    name: Deploy release to Oracle bot/API
    needs: release
    runs-on: ubuntu-22.04
    environment: oracle
    timeout-minutes: 20
    steps:
      - name: Prepare SSH credentials
        shell: bash
        env:
          SSH_PRIVATE_KEY: ${{ secrets.ORACLE_SSH_PRIVATE_KEY }}
          SSH_KNOWN_HOSTS: ${{ secrets.ORACLE_SSH_KNOWN_HOSTS }}
        run: |
          set -euo pipefail
          test -n "$SSH_PRIVATE_KEY" || { echo 'ORACLE_SSH_PRIVATE_KEY is not configured.' >&2; exit 1; }
          test -n "$SSH_KNOWN_HOSTS" || { echo 'ORACLE_SSH_KNOWN_HOSTS is not configured.' >&2; exit 1; }
          mkdir -p "$HOME/.ssh"
          chmod 700 "$HOME/.ssh"
          printf '%s\n' "$SSH_PRIVATE_KEY" > "$HOME/.ssh/monstermaze_oracle"
          printf '%s\n' "$SSH_KNOWN_HOSTS" > "$HOME/.ssh/oracle_known_hosts"
          chmod 600 "$HOME/.ssh/monstermaze_oracle" "$HOME/.ssh/oracle_known_hosts"

      - name: Deploy immutable release to Oracle
        shell: bash
        env:
          ORACLE_SSH_HOST: ${{ secrets.ORACLE_SSH_HOST }}
          ORACLE_SSH_USER: ${{ secrets.ORACLE_SSH_USER }}
          ORACLE_SSH_PORT: ${{ secrets.ORACLE_SSH_PORT }}
          RELEASE_TAG: ${{ env.RELEASE_TAG }}
        run: |
          set -euo pipefail
          test -n "$ORACLE_SSH_HOST" || { echo 'ORACLE_SSH_HOST is not configured.' >&2; exit 1; }
          test -n "$ORACLE_SSH_USER" || { echo 'ORACLE_SSH_USER is not configured.' >&2; exit 1; }
          port="${ORACLE_SSH_PORT:-22}"
          awk -v host="$ORACLE_SSH_HOST" 'NF >= 3 && $2 ~ /^ssh-/ { print host " " $2 " " $3 }' "$HOME/.ssh/oracle_known_hosts" > "$HOME/.ssh/known_hosts"
          test -s "$HOME/.ssh/known_hosts" || { echo 'Oracle known_hosts contains no usable host keys.' >&2; exit 1; }
          ssh -p "$port" -i "$HOME/.ssh/monstermaze_oracle" -o BatchMode=yes -o StrictHostKeyChecking=yes \
            "${ORACLE_SSH_USER}@${ORACLE_SSH_HOST}" \
            "curl -fsSL https://raw.githubusercontent.com/joshbet9/MonsterMaze/refs/tags/${RELEASE_TAG}/ops/oracle/deploy-release.sh | bash -s -- ${RELEASE_TAG}"
'''
              text += oracle_job

          if 'publish-release:' not in text:
              publish_job = r'''\n\n  publish-release:
    name: Publish GitHub Release after all deployments
    needs: [deploy-fly, deploy-hyperv, deploy-oracle]
    runs-on: ubuntu-22.04
    permissions:
      contents: write
    timeout-minutes: 10
    steps:
      - name: Download validated release assets
        uses: actions/download-artifact@v5
        with:
          name: release-assets

      - name: Publish GitHub Release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ env.RELEASE_TAG }}
        run: |
          set -euo pipefail
          gh release create "$RELEASE_TAG" \
            solo/MonsterMaze-Solo.zip \
            solo/solo-1.8-version.json \
            MonsterMaze-Solo-1.8-plugin.jar \
            solo/1.21/1.21-MonsterMaze-Solo.zip \
            solo/1.21/solo-1.21-version.json \
            MonsterMaze-Solo-1.21-plugin.jar \
            MonsterMaze-Solo-1.21-Paper.jar \
            MonsterMaze-Solo-1.21-ProtocolLib.jar \
            MonsterMaze-Server-1.8.zip \
            MonsterMaze-Server-1.21.zip \
            DOCKER-IMAGE.txt \
            SHA256SUMS.txt \
            --title "Monster Maze $RELEASE_TAG" \
            --generate-notes \
            --verify-tag
'''
              text += publish_job

          Path('/tmp/new-release.yml').write_text(text)
          payload = {
              'message': 'ci: make Oracle deployment part of release gate',
              'content': base64.b64encode(text.encode()).decode(),
              'sha': release['sha'],
              'branch': 'main',
          }
          Path('/tmp/release-payload.json').write_text(json.dumps(payload))
          print('release workflow transformed')
          print('preflight-oracle:', 'preflight-oracle:' in text)
          print('publish-release:', 'publish-release:' in text)
          print('old publish step:', '      - name: Publish GitHub Release' in text)

          if not ('preflight-oracle:' in text and 'publish-release:' in text and 'deploy-oracle:' in text):
              raise SystemExit('Workflow transformation validation failed.')
          if 'needs: [preflight-fly, preflight-hyperv, preflight-oracle]' not in text:
              raise SystemExit('Release job dependency validation failed.')

          os.environ['RELEASE_SHA'] = release['sha']
          PY
          gh api --method PUT "repos/${GH_REPO}/contents/.github/workflows/release.yml" --input /tmp/release-payload.json

      - name: Remove standalone Oracle deployment workflow
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          if gh api "repos/${GITHUB_REPOSITORY}/contents/.github/workflows/deploy-oracle.yml?ref=main" > /tmp/oracle.json 2>/dev/null; then
            sha="$(python3 -c 'import json; print(json.load(open("/tmp/oracle.json"))["sha"])')"
            gh api --method DELETE "repos/${GITHUB_REPOSITORY}/contents/.github/workflows/deploy-oracle.yml" \
              -f message='ci: remove standalone Oracle deployment workflow' \
              -f sha="$sha" \
              -f branch=main
          else
            echo 'Standalone Oracle workflow already absent.'
          fi

      - name: Remove migration workflow
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          sha="$(gh api "repos/${GITHUB_REPOSITORY}/contents/.github/workflows/migrate-release-pipeline.yml?ref=main" --jq .sha)"
          gh api --method DELETE "repos/${GITHUB_REPOSITORY}/contents/.github/workflows/migrate-release-pipeline.yml" \
            -f message='ci: remove one-time release pipeline migration workflow' \
            -f sha="$sha" \
            -f branch=main
