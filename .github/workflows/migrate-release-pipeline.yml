name: Migrate release pipeline

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/migrate-release-pipeline.yml'

permissions:
  contents: write
  actions: write

jobs:
  migrate:
    runs-on: ubuntu-22.04
    steps:
      - name: Checkout migration helper
        uses: actions/checkout@v5

      - name: Apply release pipeline migration
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: python3 ops/ci/migrate_release_pipeline.py

      - name: Remove one-time migration workflow
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          sha="$(gh api "repos/${GITHUB_REPOSITORY}/contents/.github/workflows/migrate-release-pipeline.yml?ref=main" --jq .sha)"
          gh api --method DELETE "repos/${GITHUB_REPOSITORY}/contents/.github/workflows/migrate-release-pipeline.yml" \
            -f message='ci: remove one-time release pipeline migration workflow' \
            -f sha="$sha" \
            -f branch=main
