name: Restart Hyper-V Monster Maze servers now

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: hyperv-forced-restart-now
  cancel-in-progress: false

jobs:
  restart:
    name: Restart both Hyper-V integration servers
    runs-on: ubuntu-22.04
    environment: hyperv
    timeout-minutes: 8
    steps:
      - name: Connect runner to Hyper-V network
        uses: tailscale/github-action@v4
        with:
          oauth-client-id: ${{ secrets.TS_OAUTH_CLIENT_ID }}
          oauth-secret: ${{ secrets.TS_OAUTH_SECRET }}
          tags: tag:github-actions
          ping: 100.98.188.97

      - name: Prepare SSH credentials
        shell: bash
        env:
          SSH_PRIVATE_KEY: ${{ secrets.HYPERV_SSH_PRIVATE_KEY }}
          SSH_KNOWN_HOSTS: ${{ secrets.HYPERV_SSH_KNOWN_HOSTS }}
        run: |
          set -euo pipefail
          test -n "$SSH_PRIVATE_KEY"
          test -n "$SSH_KNOWN_HOSTS"
          mkdir -p "$HOME/.ssh"
          chmod 700 "$HOME/.ssh"
          printf '%s\n' "$SSH_PRIVATE_KEY" > "$HOME/.ssh/monstermaze_hyperv"
          printf '%s\n' "$SSH_KNOWN_HOSTS" > "$HOME/.ssh/known_hosts"
          chmod 600 "$HOME/.ssh/monstermaze_hyperv" "$HOME/.ssh/known_hosts"

      - name: Restart both servers and verify fresh processes
        shell: bash
        env:
          HYPERV_SSH_HOST: ${{ secrets.HYPERV_SSH_HOST }}
          HYPERV_SSH_USER: ${{ secrets.HYPERV_SSH_USER }}
          HYPERV_SSH_PORT: ${{ secrets.HYPERV_SSH_PORT }}
        run: |
          set -euo pipefail
          port="${HYPERV_SSH_PORT:-22}"
          ssh -p "$port" -i "$HOME/.ssh/monstermaze_hyperv" \
            -o BatchMode=yes -o ConnectTimeout=15 -o StrictHostKeyChecking=yes \
            -o UserKnownHostsFile="$HOME/.ssh/known_hosts" \
            "$HYPERV_SSH_USER@$HYPERV_SSH_HOST" "sudo -n bash -s" <<'REMOTE'
          set -Eeuo pipefail
          services=(monstermaze-18.service monstermaze-21.service)
          declare -A old_pid
          for service in "${services[@]}"; do
            systemctl is-active --quiet "$service"
            old_pid["$service"]="$(systemctl show "$service" -p MainPID --value)"
            echo "$service before restart: PID ${old_pid[$service]}"
          done

          systemctl restart "${services[@]}"

          for service in "${services[@]}"; do
            ready=0
            for attempt in $(seq 1 60); do
              if systemctl is-active --quiet "$service"; then
                new_pid="$(systemctl show "$service" -p MainPID --value)"
                if [[ -n "$new_pid" && "$new_pid" != "0" && "$new_pid" != "${old_pid[$service]}" ]]; then
                  ready=1
                  echo "$service after restart: PID $new_pid"
                  systemctl show "$service" -p ActiveState -p SubState -p ExecMainStartTimestamp
                  break
                fi
              fi
              sleep 1
            done
            if [[ "$ready" -ne 1 ]]; then
              echo "ERROR: $service did not come back with a new process." >&2
              timeout 10 journalctl -u "$service" -n 60 --no-pager || true
              exit 1
            fi
          done
          echo "Both Hyper-V server processes were restarted and verified."
          REMOTE
