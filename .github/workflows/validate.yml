name: Validate Monster Maze

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

env:
  BUILDTOOLS_URL: 'https://hub.spigotmc.org/jenkins/job/BuildTools/200/artifact/target/BuildTools.jar'

jobs:
  build-1-8:
    name: Build Minecraft 1.8.8
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java 8
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '8'
          cache: maven

      - name: Download pinned BuildTools
        shell: bash
        run: |
          set -euo pipefail
          curl -fsSL "$BUILDTOOLS_URL" -o "$RUNNER_TEMP/BuildTools.jar"

      - name: Build Spigot 1.8.8 dependency
        shell: bash
        run: |
          set -euo pipefail
          export MAVEN_OPTS='-Xmx2G'
          java -Xmx2G -jar "$RUNNER_TEMP/BuildTools.jar" --rev 1.8.8 --output-dir "$RUNNER_TEMP/spigot"
          test -f "$RUNNER_TEMP/spigot/spigot-1.8.8.jar"

      - name: Build and test
        working-directory: 1.8/MonsterMazeStandalone
        env:
          MAVEN_OPTS: '-Xmx2G'
        run: mvn -B clean package

  build-1-21:
    name: Build Minecraft 1.21.x
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven

      - name: Build and test
        working-directory: 1.21/MonsterMazeStandalone
        run: mvn -B clean package

  deployment-config:
    name: Validate deployment configuration
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Check Solo and hosted-server modes
        shell: bash
        run: |
          set -euo pipefail

          assert_value() {
            local file="$1"
            local expected="$2"
            local actual
            actual=$(awk -F': *' '$1 == "solo-mode" { print $2; exit }' "$file")
            if [ "$actual" != "$expected" ]; then
              echo "Expected solo-mode: $expected in $file, found '$actual'"
              exit 1
            fi
          }

          assert_value solo/server/plugins/MonsterMazeStandalone/config.yml true
          assert_value solo/1.21/server/plugins/MonsterMazeStandalone/config.yml true
          assert_value docker/deployments/fly/1.8/config.yml false
          assert_value docker/deployments/fly/1.21/config.yml false

      - name: Check Fly entrypoint applies deployment configuration
        shell: bash
        run: |
          set -euo pipefail
          grep -q 'apply_deployment_config' docker/entrypoint.sh
          grep -q '/opt/mm18-deployment-config.yml' docker/entrypoint.sh
          grep -q '/opt/mm21-deployment-config.yml' docker/entrypoint.sh
          grep -q 'docker/deployments/fly/1.8/config.yml' Dockerfile
          grep -q 'docker/deployments/fly/1.21/config.yml' Dockerfile

  repository-hygiene:
    name: Repository hygiene
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Check generated/build output is not tracked
        shell: bash
        run: |
          set -euo pipefail
          forbidden='(^|/)(target|solo-dist)(/|$)|\.class$'
          if git ls-files | grep -E "$forbidden"; then
            echo 'Tracked generated/build output detected.'
            exit 1
          fi

      - name: Check for oversized tracked files
        shell: bash
        run: |
          set -euo pipefail
          max=$((95 * 1024 * 1024))
          failed=0
          while IFS= read -r -d '' file; do
            size=$(stat -c '%s' "$file")
            if [ "$size" -gt "$max" ]; then
              echo "Tracked file is too large for a safe GitHub repository: $file ($size bytes)"
              failed=1
            fi
          done < <(git ls-files -z)
          exit "$failed"
