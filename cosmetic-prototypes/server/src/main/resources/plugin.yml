name: MinigameCosmeticPrototypes
version: 0.1.0
main: me.monstermaze.cosmetics.MinigameCosmeticPrototypes
author: MonsterMaze contributors
description: Isolated server-side cosmetic visual prototypes for Runner, Bacon Brawl, Dragon Escape and Evolution.
commands:
  cosmeticproto:
    aliases: [gamecosmetic, gamecosmetics]
    description: Unlock, equip and preview isolated minigame cosmetic prototypes.
    usage: /cosmeticproto <list|status|unlock|equip|off|preview>
permissions:
  minigamecosmetics.admin:
    description: Allows prototype cosmetic unlocks and testing.
    default: op