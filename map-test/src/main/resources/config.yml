# MonsterMazeStandalone configuration
# Active game mode: Original, Speed, Modern, or Lagless
mode: Original

# Solo mode: when true, the plugin records a run record (JSON) to the
# solo-runs/ data folder whenever a solo run ends. Used by the standalone
# solo launcher for crowd-sourced leaderboards. Safe to leave false on the
# normal hosted multiplayer server.
solo-mode: false

# ---- Arena map --------------------------------------------------------------
# The world a game runs in. Choose from the "maps:" keys below (void is the
# classic empty-air arena). This file is protected from the auto-updater, so
# players can pick their favourite map freely.
map: void

# Per-map settings. "world-folder" must match a world folder in the server
# directory (shipped with the game); "void" is generated automatically.
# Maze palette mirrors Mineplex B3/B2/B1 (bottom/middle/top), each an id+data
# pair for the 1.8 block. "mob" is the monster skin (snowman, zombie, squid,
# ocelot, zombie pigman or villager - all share identical logic). "center" is
# the default maze anchor (auto-picked, correctable).
maps:
  void:
    world-folder: mm_void
    mob: snowman
    center: {x: 0, y: 64, z: 0}
    # default theme (quartz top/mid, stone base) is used when no palette given
  volcano:
    world-folder: mm_volcano
    mob: zombie pigman
    center: {x: -3, y: 114, z: 3}
    # volcanic theme
    top:    {id: 112, data: 0}    # nether brick (walk surface)
    mid:    {id: 87,  data: 0}    # netherrack (support)
    bottom: {id: 112, data: 0}    # nether brick (base)
  colombia:
    world-folder: mm_colombia
    mob: ocelot
    center: {x: -7, y: 61, z: 5}
    # jungle theme
    top:    {id: 2,   data: 0}    # grass block (walk surface)
    mid:    {id: 1,   data: 2}    # polished granite (support)
    bottom: {id: 5,   data: 0}    # oak wood planks (base)
  sandycoast:
    world-folder: mm_sandycoast
    mob: villager
    center: {x: 23, y: 13, z: 15}
    # desert/sand theme
    top:    {id: 155, data: 0}    # quartz block (walk surface)
    mid:    {id: 155, data: 2}    # quartz pillar (support)
    bottom: {id: 155, data: 0}    # quartz block (base)
  siberian:
    world-folder: mm_siberian
    mob: snowman
    center: {x: 0, y: 7, z: 0}
    # arctic theme
    top:    {id: 80,  data: 0}    # snow block (walk surface)
    mid:    {id: 80,  data: 0}    # snow block (support)
    bottom: {id: 80,  data: 0}    # snow block (base)
  swampland:
    world-folder: mm_swampland
    mob: zombie
    center: {x: 0, y: 7, z: 0}
    # murky swamp theme
    top:    {id: 2,   data: 0}    # grass block (walk surface)
    mid:    {id: 3,   data: 0}    # dirt (support)
    bottom: {id: 3,   data: 0}    # dirt (base)
  tesorohundido:
    world-folder: mm_tesorohundido
    mob: squid
    center: {x: 0, y: 27, z: 0}
    # buried-treasure theme
    top:    {id: 82,  data: 0}    # clay block (walk surface)
    mid:    {id: 159, data: 9}    # cyan hardened clay (support)
    bottom: {id: 35,  data: 7}    # gray wool (base)
