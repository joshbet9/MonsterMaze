name: SnakeSoloStandalone
version: 0.1.0
main: me.monstermaze.snake.SnakeSoloPlugin
author: MonsterMaze contributors
description: Isolated solo Snake gameplay and late-game magma cube hazard test.
commands:
  snake:
    description: Start and control the standalone Snake solo test.
    usage: /snake <start|stop|stats|hazard now|off|status>
permissions:
  snake.admin:
    description: Allows administrative control of the Snake prototype.
    default: op
